name: ShareIt API Tests

on:
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Find server JAR
        id: find-server-jar
        run: |
          SERVER_JAR=$(find shareit-server/target -name "*.jar" | head -n 1)
          if [ -z "$SERVER_JAR" ]; then
            echo "::error::Server JAR not found!"
            ls -R shareit-server/target/
            exit 1
          fi
          echo "SERVER_JAR=${SERVER_JAR}" >> $GITHUB_ENV

      - name: Find gateway JAR
        id: find-gateway-jar
        run: |
          GATEWAY_JAR=$(find shareit-gateway/target -name "*.jar" | head -n 1)
          if [ -z "$GATEWAY_JAR" ]; then
            echo "::error::Gateway JAR not found!"
            ls -R shareit-gateway/target/
            exit 1
          fi
          echo "GATEWAY_JAR=${GATEWAY_JAR}" >> $GITHUB_ENV

      - name: Start services
        run: |
          # Запуск сервера на порту 9090
          nohup java -jar $SERVER_JAR --server.port=9090 > server.log 2>&1 &
          # Запуск gateway на порту 8080
          nohup java -jar $GATEWAY_JAR --server.port=8080 > gateway.log 2>&1 &
          
          echo "Waiting for services to start..."
          # Проверяем оба сервиса
          timeout 180 bash -c '
            while ! (curl -s http://localhost:8080/actuator/health >/dev/null && 
                    curl -s http://localhost:9090/actuator/health >/dev/null); do 
              sleep 3; 
              echo "Retrying health checks..."; 
            done'
          echo "Both services started successfully"

      - name: Run tests
        run: mvn test

      - name: Show logs if failed
        if: failure()
        run: |
          echo "====== Server Logs ======"
          cat server.log || echo "No server logs"
          echo "====== Gateway Logs ======"
          cat gateway.log || echo "No gateway logs"

      - name: Stop services
        if: always()
        run: |
          pkill -f "shareit-server" || true
          pkill -f "shareit-gateway" || true